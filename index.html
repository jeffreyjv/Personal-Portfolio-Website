<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/JV.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Jeffrey Vincent Portfolio</title>
    <!-- Applies the theme class before first paint so there is no light-mode flash.
         Must stay above the stylesheet and before any render. Dark is the default. -->
    <script>
      try {
        if (localStorage.getItem("theme") !== "light") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
